[project]
name = "ahoy-api"
version = "0.1.0"
description = "A-hoy Marketing Platform API (Ship + Crew Deck backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pgvector>=0.4.0",
    "pydantic-settings>=2.16.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "twilio>=9.12.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "milestone_a: isolated Milestone A (auth, tenancy, devices, health)",
    "milestone_b: isolated Milestone B (brand, media, campaign, queue)",
    "milestone_c: isolated Milestone C Ship (ROI, queue polish, reviews)",
    "integration_ab: A auth/tenancy gates crossed with B content pipeline",
    "integration_abc: A auth + B pipeline + C ROI/swap/approve-all/reviews",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI uses Depends/File/Form in defaults; conftest DB ping catches any connect error.
ignore = ["B008", "BLE001"]
