name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ahoy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ahoy
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        working-directory: packages/db/migrations
        run: |
          for f in $(ls *.sql | sort); do
            psql -h localhost -U postgres -d ahoy -v ON_ERROR_STOP=1 -f "$f"
          done
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync and test
        run: |
          uv sync
          uv run pytest -m milestone_a
          uv run pytest -m milestone_b
          uv run pytest -m milestone_c
          uv run pytest -m integration_ab
          uv run pytest -m integration_abc
          uv run pytest -m milestone_d
          uv run pytest
          uv run ruff check app tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and lint
        run: |
          npm ci
          npm run lint
