# Optional local Postgres with pgvector (requires Docker).
services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ahoy
    volumes:
      - ahoy_pg:/var/lib/postgresql/data
      # Every migration runs (in filename order) on first boot of an empty volume only.
      # Existing volumes: apply new files by hand, see packages/db/README.md.
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  ahoy_pg:
